# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # A hung test used to burn the 6h default; fail fast instead. Windows runs
    # ~42m, so this is a thin margin - raise it rather than trimming coverage.
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - python-version: "3.13"
            run_llm_tests: true
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      # Tells tests/io/test_conformance.py that the "Build the conformance
      # binary" step below already produced the rust example, so its fixture
      # references the binary instead of shelling out to cargo. Unset locally,
      # where the fixture builds on demand.
      TRILOGY_IO_PREBUILT: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606  # v1.15.4
        with:
          toolchain: stable
          # This action runs Swatinem/rust-cache for us, but that defaults to
          # the repo root and there is no manifest there - `cargo metadata`
          # failed, no lockfile was hashed, and every run restored an empty
          # 773-byte cache while rebuilding both crates from scratch. Name the
          # two real workspaces; leaving either out rebuilds it every time, and
          # trilogy-io is a full arrow + parquet release build.
          cache-workspaces: |
            trilogy/scripts/dependency
            crates/trilogy-io
      - name: Install uv for script tests
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          enable-cache: true
          # The script datasources are PEP 723 files with no lockfile between
          # them, and keying on the scripts themselves would miss the cache on
          # every test edit. uv validates its own entries, so a coarse, stable
          # key is what we want here.
          cache-dependency-glob: |
            requirements.txt
            pyproject.toml
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093'  # v3
        with:
          workload_identity_provider: 'projects/734709568634/locations/global/workloadIdentityPools/github/providers/preql-integration'
          project_id: 'preqldata'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheel maturin==1.10.2
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-test.txt
          python -m pip install sqlalchemy-bigquery --ignore-requires-python
      - name: Run Rust tests
        run: |
          cd trilogy/scripts/dependency
          # Default features are what crates.io consumers get: pure Rust, no pyo3.
          cargo test --release
          # The pyo3 layer is feature-gated out of the run above, so type-check it
          # here rather than discovering a break at wheel-build time.
          cargo check --release --features python --all-targets
      - name: Build Rust extension
        run: |
          python -m pip install -e .
      - name: Build the conformance binary
        # tests/io/test_conformance.py runs this example against its python twin.
        # It used to be built from the test's own session fixture, where a cold
        # arrow + parquet release build showed up as ~300s inside one test file
        # (5 minutes of the pytest step, invisible in the timing breakdown).
        # Built here it is a named step and the rust cache above covers it.
        run: cargo build --release --example landmarks --manifest-path crates/trilogy-io/Cargo.toml
      - name: Warm the uv script environments
        # DuckDB script datasources shell out to `uv run` once per query scan,
        # and uv builds one environment per distinct PEP 723 header. For
        # pushdown_source that means building this checkout's pytrilogy
        # (maturin, so a rust compile); for anything pinned to >=3.13 it means
        # fetching an interpreter a 3.11 job does not otherwise have. Left to
        # the tests, that lands on whoever touches a script first and is a
        # 3.11-only tax: test_source_pushdown.py was 806s on 3.11 against 85s
        # on 3.13, and geography/test_landmark_updates.py 248s against 7.0s.
        # `sync` prepares each environment without running the script, so the
        # ones that would fetch remote data on execution stay untouched.
        # Discovered rather than listed so a new script cannot silently
        # reintroduce the cost. bash on both platforms for the loop.
        shell: bash
        run: |
          grep -rl '^# /// script' tests --include='*.py' | while read -r script; do
            echo "== $script"
            uv sync --script "$script"
          done
      - name: Lint with mypy
        run: |
          # stop the build if there are Python syntax errors or undefined names
          python -m mypy trilogy
      - name: Lint with ruff
        run: |
          # stop the build if there are Python syntax errors or undefined names
          python -m ruff check trilogy
      - name: Lint with black
        run: |
          python -m black --check .
      - name: Test with pytest
        if: matrix.run_llm_tests == true
        run: |
          python -m pip install pytest
          python -m pip install pytest-cov
          python -m pytest tests/ --cov=trilogy -m "not adventureworks_execution and not cloud_live"
        env:
          GOOGLE_HMAC_SECRET: ${{ secrets.GOOGLE_HMAC_SECRET }}
          GOOGLE_HMAC_KEY: ${{ secrets.GOOGLE_HMAC_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Test with pytest (skip LLM provider tests)
        if: matrix.run_llm_tests != true
        run: |
          python -m pip install pytest
          python -m pip install pytest-cov
          python -m pytest tests/ --cov=trilogy -m "not adventureworks_execution and not cloud_live" --ignore=tests/ai/test_providers_basic.py
        env:
          GOOGLE_HMAC_SECRET: ${{ secrets.GOOGLE_HMAC_SECRET }}
          GOOGLE_HMAC_KEY: ${{ secrets.GOOGLE_HMAC_KEY }}
      - name: Run differential fuzzer corpus
        # One cell only: the fixed-seed corpus is deterministic, so extra
        # matrix cells re-prove the same result. This is the sweep the
        # V4-default flip shipped without — 20 silent regressions
        # (evals/tpcds_agent/handoff_fuzzer_v4_default_regressions.md).
        if: matrix.run_llm_tests == true
        run: |
          python -m local_scripts.fuzzer
      - name: Test after installing rich
        run: |
          # install rich and rerun CLI tests. One invocation, not three: the -k
          # filters are disjoint but each run re-collected the whole tests/ tree.
          python -m pip install rich
          python -m pytest tests/ --cov=trilogy --cov-append -m "not adventureworks_execution" -k "test_trilogy or test_display or test_refresh"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          name: ${{ matrix.os }}-py${{ matrix.python-version }}
      - name: Test package cli (Linux)
        if: runner.os != 'Windows'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install .
          .venv/bin/trilogy --help
          .venv/bin/trilogy run "SELECT 1 + 1->test;" duckdb
      - name: Test package cli (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --upgrade pip
          .venv/Scripts/python -m pip install .
          .venv/Scripts/trilogy --help
          .venv/Scripts/trilogy run "SELECT 1 + 1->test;" duckdb
