# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # A hung test used to burn the 6h default; fail fast instead. Windows runs
    # ~42-50m, so keep a margin - raise it rather than trimming coverage.
    timeout-minutes: 60
    strategy:
      # One failing cell (e.g. a 2.x-only break) should not cancel the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        # Temporary while both majors are supported: 2.x moved shellfs to
        # Query.Farm, dropped `x ->` lambdas and aborts transactions on bind
        # errors. Drop the axis once <2 support goes.
        duckdb: ["1.x"]
        include:
          - python-version: "3.13"
            run_llm_tests: true
          - os: ubuntu-latest
            python-version: "3.13"
            duckdb: "2.x"
          - os: windows-latest
            python-version: "3.13"
            duckdb: "2.x"
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      # Coverage runs under sys.monitoring on 3.12+ (~60% overhead on this
      # suite) but needs the C tracer on 3.11 (~150%), which made the 3.11
      # cells the longest in the matrix by 10 minutes. 3.11 runs the same
      # tests uncovered; its only unique lines are version-specific branches.
      PYTEST_COV: ${{ matrix.python-version != '3.11' && matrix.duckdb == '1.x' && '--cov=trilogy' || '' }}
      # Tells tests/io/test_conformance.py that the "Build the conformance
      # binary" step below already produced the rust example, so its fixture
      # references the binary instead of shelling out to cargo. Unset locally,
      # where the fixture builds on demand.
      TRILOGY_IO_PREBUILT: '1'
      # The extension is built three times per job: the editable install, the
      # editable install uv makes for pushdown_source.py's script environment,
      # and the packaged-CLI wheel. pyo3's build config is keyed on the
      # interpreter path, so each venv used to force a full release compile of
      # the crate (22-50s each). With the base interpreter passed instead, the
      # second and third builds are cargo no-ops.
      MATURIN_PEP517_USE_BASE_PYTHON: '1'
      # The 3.11 and 3.12 cells fetch a managed 3.13 for the >=3.13 scripts;
      # under uv's default preference every later script would then pick that
      # interpreter, and pushdown_source.py would recompile the extension for it.
      UV_PYTHON_PREFERENCE: system
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606  # v1.15.4
        with:
          toolchain: stable
          # This action runs Swatinem/rust-cache for us, but that defaults to
          # the repo root and there is no manifest there - `cargo metadata`
          # failed, no lockfile was hashed, and every run restored an empty
          # 773-byte cache while rebuilding both crates from scratch. Name the
          # two real workspaces; leaving either out rebuilds it every time, and
          # trilogy-io is a full arrow + parquet release build.
          cache-workspaces: |
            trilogy/scripts/dependency
            crates/trilogy-io
          # Bumped when the cached profiles change: an exact key hit is never
          # re-saved, so the dev-profile deps `cargo test` builds would
          # otherwise be compiled on every run until Cargo.lock next moves.
          cache-key: dev-tests
      - name: Install uv for script tests
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          enable-cache: true
          # The script datasources are PEP 723 files with no lockfile between
          # them, and keying on the scripts themselves would miss the cache on
          # every test edit. uv validates its own entries, so a coarse, stable
          # key is what we want here.
          cache-dependency-glob: |
            requirements.txt
            pyproject.toml
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093'  # v3
        with:
          workload_identity_provider: 'projects/734709568634/locations/global/workloadIdentityPools/github/providers/preql-integration'
          project_id: 'preqldata'
      - name: Install dependencies
        # uv resolves and installs into the job's interpreter several times
        # faster than pip and shares the cache the step above restores.
        # sqlalchemy-bigquery is in requirements-test.txt; the separate pip
        # line with --ignore-requires-python dated from a release that
        # excluded the Python of the day and has not been needed since.
        run: |
          uv pip install --system wheel maturin==1.10.2 -r requirements.txt -r requirements-test.txt
      - name: Run Rust tests
        run: |
          cd trilogy/scripts/dependency
          # Default features are what crates.io consumers get: pure Rust, no pyo3.
          # Dev profile: the release profile's LTO link of every test binary was
          # 40-90s of a 5s debug build, and the release extension is exercised by
          # the whole pytest step anyway.
          cargo test
          # The pyo3 layer is feature-gated out of the run above, so type-check it
          # here rather than discovering a break at wheel-build time.
          cargo check --features python --all-targets
      - name: Build Rust extension
        run: |
          python -m pip install -e .
      - name: Generate TPC fixtures with DuckDB 1.x
        # dsdgen draws different rows under 2.x and the modeling tests pin
        # results to the 1.x data, so the 2.x cells reuse it.
        if: matrix.duckdb == '2.x'
        run: python .scripts/generate_tpc_fixtures.py
      - name: Install DuckDB 2.x
        if: matrix.duckdb == '2.x'
        run: |
          uv pip install --system "duckdb>=2,<3"
      - name: Build the conformance binary
        # tests/io/test_conformance.py runs this example against its python twin.
        # It used to be built from the test's own session fixture, where a cold
        # arrow + parquet release build showed up as ~300s inside one test file
        # (5 minutes of the pytest step, invisible in the timing breakdown).
        # Built here it is a named step and the rust cache above covers it.
        run: cargo build --release --example landmarks --example catalog --manifest-path crates/trilogy-io/Cargo.toml
      - name: Warm the uv script environments
        # DuckDB script datasources shell out to `uv run` once per query scan,
        # and uv builds one environment per distinct PEP 723 header. For
        # pushdown_source that means building this checkout's pytrilogy
        # (maturin, so a rust compile); for anything pinned to >=3.13 it means
        # fetching an interpreter a 3.11 job does not otherwise have. Left to
        # the tests, that lands on whoever touches a script first and is a
        # 3.11-only tax: test_source_pushdown.py was 806s on 3.11 against 85s
        # on 3.13, and geography/test_landmark_updates.py 248s against 7.0s.
        # `sync` prepares each environment without running the script, so the
        # ones that would fetch remote data on execution stay untouched.
        # Discovered rather than listed so a new script cannot silently
        # reintroduce the cost. bash on both platforms for the loop.
        # Warming is an optimization, never a gate: a script whose environment
        # cannot resolve here is not necessarily one any test runs, and the
        # test that does need it will fail on its own terms. Report and carry
        # on rather than failing the build on a fixture's dependencies.
        shell: bash
        run: |
          # First line only: a `# /// script` block also appears inside test
          # files that carry a script as a string literal, and those are not
          # scripts themselves.
          find tests -name '*.py' | sort | while read -r script; do
            head -1 "$script" | grep -q '^#!/usr/bin/env -S uv run' || continue
            echo "== $script"
            uv sync --script "$script" || echo "WARNING: could not pre-warm $script"
          done
      - name: Locate the Lark parser cache
        # Lark pickles its LALR tables next to the grammar's hash in the
        # interpreter's temp dir and rebuilds on a miss. The build is ~6s on
        # 3.13 and ~30s on 3.11 under the C coverage tracer, paid by the first
        # test that reaches the Lark backend. The file carries the grammar +
        # lark-version + python-version hash and is verified on load, so a
        # stale restore is only a miss. The key names the same inputs.
        id: lark-cache
        shell: bash
        run: |
          echo "dir=$(python -c 'import tempfile; print(tempfile.gettempdir())')" >> "$GITHUB_OUTPUT"
          echo "lark=$(python -c 'import lark; print(lark.__version__)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ steps.lark-cache.outputs.dir }}/.lark_cache_*
          key: lark-${{ runner.os }}-py${{ matrix.python-version }}-lark${{ steps.lark-cache.outputs.lark }}-${{ hashFiles('trilogy/parsing/trilogy.lark') }}
      - name: Pre-fetch the gcat parquet fixtures
        # tests/modeling/gcat/setup.sql builds its tables from nine parquet
        # files on GCS. Left to the tests that is ~6.5MB plus an INSTALL httpfs
        # pulled inside the pytest step on every matrix job, and latency is what
        # hurts: a degraded runner took gcat from 4.4s to 365s while every
        # CPU-bound test in the same job held at 1.0x. Fetched here it is a
        # named step and the tests read local files. Like the uv warm above this
        # is an optimization, never a gate -- the conftest falls back to the
        # original URLs unless every file is present.
        run: python .scripts/fetch_gcat_data.py
      - name: Lint with mypy
        run: |
          # stop the build if there are Python syntax errors or undefined names
          python -m mypy trilogy
      - name: Lint with ruff
        run: |
          # stop the build if there are Python syntax errors or undefined names
          python -m ruff check trilogy
      - name: Lint with black
        run: |
          python -m black --check .
      - name: Benchmark plans did not grow against main
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && matrix.duckdb == '1.x'
        run: |
          git fetch --no-tags --depth=1 origin main
          python .scripts/check_benchmark_growth.py FETCH_HEAD
      - name: Test with pytest
        if: matrix.run_llm_tests == true
        shell: bash
        run: |
          python -m pytest tests/ $PYTEST_COV --durations=80 -m "not adventureworks_execution and not cloud_live"
        env:
          GOOGLE_HMAC_SECRET: ${{ secrets.GOOGLE_HMAC_SECRET }}
          GOOGLE_HMAC_KEY: ${{ secrets.GOOGLE_HMAC_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Test with pytest (skip LLM provider tests)
        if: matrix.run_llm_tests != true
        shell: bash
        run: |
          python -m pytest tests/ $PYTEST_COV --durations=80 -m "not adventureworks_execution and not cloud_live" --ignore=tests/ai/test_providers_basic.py
        env:
          GOOGLE_HMAC_SECRET: ${{ secrets.GOOGLE_HMAC_SECRET }}
          GOOGLE_HMAC_KEY: ${{ secrets.GOOGLE_HMAC_KEY }}
      - name: Run differential fuzzer corpus
        # One cell only: the fixed-seed corpus is deterministic, so extra
        # matrix cells re-prove the same result. This is the sweep the
        # V4-default flip shipped without — 20 silent regressions
        # (evals/tpcds_agent/handoff_fuzzer_v4_default_regressions.md).
        if: matrix.run_llm_tests == true
        run: |
          python -m local_scripts.fuzzer
      - name: Test after installing rich
        shell: bash
        run: |
          # install rich and rerun CLI tests. One invocation, not three: the -k
          # filters are disjoint but each run re-collected the whole tests/ tree.
          uv pip install --system rich
          python -m pytest tests/ $PYTEST_COV ${PYTEST_COV:+--cov-append} --durations=30 -m "not adventureworks_execution" -k "test_trilogy or test_display or test_refresh"
      - name: Upload coverage to Codecov
        if: matrix.python-version != '3.11' && matrix.duckdb == '1.x'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          name: ${{ matrix.os }}-py${{ matrix.python-version }}
      - name: Test package cli (Linux)
        if: runner.os != 'Windows'
        run: |
          python -m venv .venv
          uv pip install --python .venv .
          .venv/bin/trilogy --help
          .venv/bin/trilogy run "SELECT 1 + 1->test;" duckdb
      - name: Test package cli (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          uv pip install --python .venv .
          .venv/Scripts/trilogy --help
          .venv/Scripts/trilogy run "SELECT 1 + 1->test;" duckdb
