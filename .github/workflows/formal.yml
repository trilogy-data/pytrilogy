# The Lean model in formal/ is the oracle for the fuzzer's `law` family; a
# theorem that stops checking means a law case no longer has a proof behind it.

name: Formal semantics

on:
  push:
    branches: [main]
    paths: ["formal/**", ".github/workflows/formal.yml"]
  pull_request:
    branches: [main]
    paths: ["formal/**", ".github/workflows/formal.yml"]

concurrency:
  # A newer push to the same PR supersedes the running checks; runs on main
  # are never cancelled, so every merge keeps its own result.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: 'read'
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check proofs
        working-directory: formal
        run: |
          lake build
          ! grep -rn "sorry" Trilogy
