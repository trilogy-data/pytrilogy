# The Lean model in formal/ is the oracle for the fuzzer's `law` family; a
# theorem that stops checking means a law case no longer has a proof behind it.

name: Formal semantics

on:
  push:
    branches: [main]
    paths: ["formal/**", ".github/workflows/formal.yml"]
  pull_request:
    branches: [main]
    paths: ["formal/**", ".github/workflows/formal.yml"]

concurrency:
  # A newer push to the same PR supersedes the running checks; runs on main
  # are never cancelled, so every merge keeps its own result.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: 'read'
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # lake rebuilds a module only when it or an import changed, so a restored
      # build directory leaves the modules a PR did not touch alone.
      - name: Cache the build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: formal/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain') }}-${{ hashFiles('formal/**/*.lean', 'formal/lakefile.toml') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain') }}-
      - name: Check proofs
        working-directory: formal
        run: |
          lake build
          ! grep -rn "sorry" Trilogy
