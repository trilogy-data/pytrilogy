# This workflow will upload a Python Package using maturin when a release is created
name: Push to PyPI
on:
  push:
    branches: [main]
env:
  PYTHON_VERSIONS: "3.11 3.12 3.13"
jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.version_check.outputs.should_publish }}
      local_version: ${{ steps.version_check.outputs.local_version }}
      pypi_version: ${{ steps.version_check.outputs.pypi_version }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: '3.13'
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606  # v1.15.4
      with:
        toolchain: stable
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin==1.14.1 packaging requests
        pip install -r requirements.txt
    - name: Build for version check
      run: pip install -e .
    - name: Check if version needs publishing
      id: version_check
      run: |
        # Get local version from trilogy.__version__
        LOCAL_VERSION=$(python -c "import trilogy; print(trilogy.__version__)")

        if [ -z "$LOCAL_VERSION" ]; then
          echo "Error: Could not determine local version from trilogy.__version__"
          exit 1
        fi

        echo "Local version: $LOCAL_VERSION"

        # Get PyPI version and check wheel availability
        SHOULD_PUBLISH=$(python -c "
        import sys
        import requests
        from packaging import version

        local_ver = version.parse('$LOCAL_VERSION')
        python_versions = '${{ env.PYTHON_VERSIONS }}'.split()

        try:
          response = requests.get('https://pypi.org/pypi/pytrilogy/json', timeout=10)
          if response.status_code != 200:
            print('true')
            exit(0)

          data = response.json()
          pypi_ver = version.parse(data['info']['version'])

          print(f'PyPI version: {pypi_ver}', file=sys.stderr)

          # If local version is newer, publish
          if local_ver > pypi_ver:
            print('true')
            exit(0)

          # If versions don't match, don't publish
          if local_ver != pypi_ver:
            print('false')
            exit(0)

          # Versions match - check if all wheels exist
          print(f'Versions match ({local_ver}), checking wheels...', file=sys.stderr)

          # Generate expected wheel patterns from Python versions
          platforms = [
            'manylinux_2_17_x86_64',
            'manylinux_2_17_aarch64',
            'macosx_10_12_x86_64',
            'macosx_11_0_arm64',
            'win_amd64',
          ]

          expected_wheels = []
          for py_ver in python_versions:
            cp_ver = py_ver.replace('.', '')  # '3.11' -> '311'
            for platform in platforms:
              expected_wheels.append(f'cp{cp_ver}-cp{cp_ver}-{platform}')

          # Get available files
          available_files = [f['filename'] for f in data.get('urls', [])]

          # Check for missing wheels
          missing = []
          for pattern in expected_wheels:
            if not any(pattern in f for f in available_files):
              missing.append(pattern)

          # Check for sdist
          has_sdist = any(f.endswith('.tar.gz') for f in available_files)

          if missing:
            print(f'Missing wheels: {missing}', file=sys.stderr)
            print('true')
          elif not has_sdist:
            print('Missing sdist', file=sys.stderr)
            print('true')
          else:
            print('All wheels and sdist present', file=sys.stderr)
            print('false')

        except Exception as e:
          print(f'Error checking PyPI: {e}', file=sys.stderr)
          print('true')  # Publish on error to be safe
        ")

        echo "Should publish: $SHOULD_PUBLISH"
        echo "should_publish=$SHOULD_PUBLISH" >> $GITHUB_OUTPUT
        echo "local_version=$LOCAL_VERSION" >> $GITHUB_OUTPUT

  linux:
    needs: version-check
    if: needs.version-check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - name: Set up Python for version sync
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: '3.13'
    - name: Sync version to Cargo.toml
      run: python .scripts/sync_version.py
    - name: Build wheels
      uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad  # v1.50.1
      with:
        target: ${{ matrix.target }}
        args: --release --out dist --interpreter ${{ env.PYTHON_VERSIONS }}
        sccache: 'true'
        manylinux: auto
        rust-toolchain: stable
        docker-options: -e PYO3_CROSS_LIB_DIR
    - name: Patch wheels with dependencies
      run: python .scripts/patch_wheels.py dist
    - name: Validate patched wheels
      if: matrix.target == 'x86_64'
      run: |
        # Test that a patched wheel installs with dependencies
        # Filter for Python 3.13 wheels for the current target architecture
        WHEEL=$(ls dist/*cp313-cp313*${{ matrix.target }}*.whl | head -n 1)
        if [ -z "$WHEEL" ]; then
          echo "Error: No Python 3.13 wheel found for target ${{ matrix.target }}"
          exit 1
        fi
        echo "Testing wheel: $WHEEL"
        python -m venv test_venv
        test_venv/bin/pip install --upgrade pip
        test_venv/bin/pip install "$WHEEL"
        # Verify trilogy CLI works (which requires dependencies)
        test_venv/bin/trilogy --help
        test_venv/bin/trilogy run "SELECT 1 + 1->test;" duckdb
        rm -rf test_venv
    - name: Upload wheels
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
      with:
        name: wheels-linux-${{ matrix.target }}
        path: dist

  macos:
    needs: version-check
    if: needs.version-check.outputs.should_publish == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - name: Set up Python for version sync
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: '3.13'
    - name: Sync version to Cargo.toml
      run: python .scripts/sync_version.py
    - name: Build wheels
      uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad  # v1.50.1
      with:
        target: ${{ matrix.target }}
        args: --release --out dist --interpreter ${{ env.PYTHON_VERSIONS }}
    - name: Patch wheels with dependencies
      run: python .scripts/patch_wheels.py dist
    - name: Upload wheels
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
      with:
        name: wheels-macos-${{ matrix.target }}
        path: dist

  windows:
    needs: version-check
    if: needs.version-check.outputs.should_publish == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - name: Set up Python for version sync
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: '3.13'
    - name: Sync version to Cargo.toml
      run: python .scripts/sync_version.py
    - name: Build wheels
      uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad  # v1.50.1
      with:
        target: ${{ matrix.target }}
        args: --release --out dist --interpreter ${{ env.PYTHON_VERSIONS }}
    - name: Patch wheels with dependencies
      run: python .scripts/patch_wheels.py dist
    - name: Validate patched wheels
      shell: bash
      run: |
        # Test that a patched wheel installs with dependencies
        # Filter for Python 3.13 wheels for the win_amd64 platform
        WHEEL=$(ls dist/*cp313-cp313*win_amd64*.whl | head -n 1) #
        if [ -z "$WHEEL" ]; then
          echo "Error: No Python 3.13 wheel found for target win_amd64"
          exit 1
        fi
        echo "Testing wheel: $WHEEL"
        python -m venv test_venv
        test_venv/Scripts/pip install "$WHEEL"
        # Verify trilogy CLI works (which requires dependencies)
        test_venv/Scripts/trilogy --help
        test_venv/Scripts/trilogy run "SELECT 1 + 1->test;" duckdb
        rm -rf test_venv
    - name: Upload wheels
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
      with:
        name: wheels-windows-${{ matrix.target }}
        path: dist

  wasm:
    needs: version-check
    if: needs.version-check.outputs.should_publish == 'true'
    # Soft rollout: a wasm failure must never block a release. The wheel is
    # published when it builds; promote by removing this once proven stable.
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 / Pyodide 314 only. 3.13 / Pyodide 0.29 pins emscripten 4.0.9,
        # which rejects Rust's $-mangled symbol exports (fixed in emcc 4.0.10)
        # — Rust side modules cannot link against it.
        python-version: ['3.14']
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install pyodide-build
      run: pip install pyodide-build
    - name: Sync version to Cargo.toml
      run: python .scripts/sync_version.py
    - name: Get pyodide config
      id: pyodide-config
      run: |
        echo "rust-toolchain=$(pyodide config get rust_toolchain)" >> "$GITHUB_OUTPUT"
        echo "emscripten-version=$(pyodide config get emscripten_version)" >> "$GITHUB_OUTPUT"
        # Key name depends on pyodide-build version; unsupported keys error on stdout,
        # so try both and keep the first value that looks like a platform version.
        PLATFORM_VERSION=$( (pyodide config get pyemscripten_platform_version 2>/dev/null; pyodide config get pyodide_abi_version 2>/dev/null) | grep -E '^[0-9]+_[0-9]+$' | head -n1)
        if [ -z "$PLATFORM_VERSION" ]; then
          echo "Could not resolve pyemscripten platform version from pyodide config" >&2
          exit 1
        fi
        echo "pyemscripten-platform-version=$PLATFORM_VERSION" >> "$GITHUB_OUTPUT"
        echo "rustflags=$(pyodide config get rustflags)" >> "$GITHUB_OUTPUT"
    - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984  # v16
      with:
        version: ${{ steps.pyodide-config.outputs.emscripten-version }}
    - name: Build wheel
      uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad  # v1.50.1
      env:
        CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUSTFLAGS: ${{ steps.pyodide-config.outputs.rustflags }}
        MATURIN_PYEMSCRIPTEN_PLATFORM_VERSION: ${{ steps.pyodide-config.outputs.pyemscripten-platform-version }}
        # Fat LTO SIGILLs rustc on the emscripten target (rustc-LLVM vs emscripten-LLVM
        # bitcode skew); disable for wasm only — native builds keep lto = true.
        CARGO_PROFILE_RELEASE_LTO: 'off'
      with:
        target: wasm32-unknown-emscripten
        args: --release --out dist --interpreter ${{ matrix.python-version }}
        rust-toolchain: ${{ steps.pyodide-config.outputs.rust-toolchain }}
    - name: Patch wheels with dependencies
      run: python .scripts/patch_wheels.py dist
    - name: Validate wheel in Pyodide venv
      run: |
        pyodide venv .venv-pyodide
        .venv-pyodide/bin/pip install --find-links dist pytrilogy
        .venv-pyodide/bin/python -c "
        import _preql_import_resolver
        from trilogy import parse, Dialects
        env, stmts = parse('const x <- 5; select x + 1 -> y;')
        assert len(stmts) == 2
        exec = Dialects.DUCK_DB.default_executor()
        rows = exec.execute_text('select 1+1 -> two;')[0].fetchall()
        assert rows == [(2,)], rows
        print('wasm wheel validated: parse + duckdb execution ok')
        "
    - name: Upload wheels
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
      with:
        name: wheels-wasm
        path: dist

  sdist:
    needs: version-check
    if: needs.version-check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - name: Set up Python for version sync
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: '3.13'
    - name: Sync version to Cargo.toml
      run: python .scripts/sync_version.py
    - name: Build sdist
      uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad  # v1.50.1
      with:
        command: sdist
        args: --out dist
    - name: Upload sdist
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
      with:
        name: wheels-sdist
        path: dist

  publish:
    needs: [version-check, linux, macos, windows, wasm, sdist]
    if: needs.version-check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/pytrilogy
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc
      with:
        verbose: true
        skip-existing: true

  crates-io:
    # Publishes the Rust crates to crates.io on the same version stream as
    # PyPI, for non-Python consumers:
    #   trilogy-parser (trilogy/scripts/dependency) — parser + dependency resolver
    #   trilogy-io     (crates/trilogy-io)          — write a source in Rust
    # Deliberately NOT gated on should_publish: that flag is driven by *wheel*
    # gaps, and a crate must be able to catch up on a version whose wheels
    # already all exist. Instead this job does its own two checks — the exact
    # version must exist on PyPI (a crate version always corresponds to a real
    # pytrilogy release) and must not already be on crates.io (publishes are
    # immutable, so this also makes reruns no-ops).
    #
    # The matrix is fail-fast: false so one crate stalling (e.g. awaiting its
    # trusted-publisher bootstrap) does not block the other.
    #
    # Bootstrap note: crates.io Trusted Publishing can only be configured on
    # an existing crate, so the very first publish of each is manual (cargo
    # login + cargo publish from its manifest directory). After that, add this
    # repo (workflow pythonpublish.yml, environment release) as the crate's
    # trusted publisher and this job takes over.
    needs: [version-check, publish]
    if: >-
      !cancelled() && needs.version-check.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: trilogy-parser
            manifest: trilogy/scripts/dependency/Cargo.toml
            index: tr/il/trilogy-parser
          - crate: trilogy-io
            manifest: crates/trilogy-io/Cargo.toml
            index: tr/il/trilogy-io
    environment:
      name: release
      url: https://crates.io/crates/${{ matrix.crate }}
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - name: Set up Python for version sync
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: '3.13'
    - name: Sync version to Cargo.toml
      run: python .scripts/sync_version.py
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606  # v1.15.4
      with:
        toolchain: stable
    - name: Check whether this version needs a crate publish
      id: crate_check
      run: |
        VERSION="${{ needs.version-check.outputs.local_version }}"
        # The crate stream mirrors PyPI: only publish a version that is a
        # real pytrilogy release.
        PYPI_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/pytrilogy/${VERSION}/json")
        if [ "$PYPI_CODE" != "200" ]; then
          echo "pytrilogy ${VERSION} not on PyPI (HTTP ${PYPI_CODE}); not publishing crate"
          echo "publish=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        # Sparse-index path for a 4+ char crate name is {first2}/{next2}/{name}.
        INDEX=$(curl -s -w "\n%{http_code}" "https://index.crates.io/${{ matrix.index }}")
        CODE=$(echo "$INDEX" | tail -n1)
        if [ "$CODE" = "404" ]; then
          echo "${{ matrix.crate }} not yet on crates.io; will publish ${VERSION} (requires bootstrap, see job comment)"
          echo "publish=true" >> $GITHUB_OUTPUT
        elif echo "$INDEX" | grep -q "\"vers\":\"${VERSION}\""; then
          echo "${{ matrix.crate }} ${VERSION} already on crates.io; nothing to do"
          echo "publish=false" >> $GITHUB_OUTPUT
        else
          echo "publish=true" >> $GITHUB_OUTPUT
        fi
    - name: Authenticate with crates.io
      if: steps.crate_check.outputs.publish == 'true'
      id: auth
      uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
    - name: Publish crate
      if: steps.crate_check.outputs.publish == 'true'
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      # --allow-dirty: the version sync rewrites Cargo.toml in the checkout.
      run: cargo publish --manifest-path ${{ matrix.manifest }} --allow-dirty

  skip-publish:
    needs: version-check
    if: needs.version-check.outputs.should_publish == 'false'
    runs-on: ubuntu-latest
    steps:
    - name: Skip publishing
      run: |
        echo "Skipping publish: Local version (${{ needs.version-check.outputs.local_version }}) - all wheels and sdist already present on PyPI"
