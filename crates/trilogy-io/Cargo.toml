[package]
name = "trilogy-io"
# Synced from the python __init__ by the same release flow as trilogy-parser;
# a published crate version always corresponds to a real pytrilogy release.
version = "0.3.385"
edition = "2021"
description = "Write a program that is a Trilogy data source: Arrow out, contract flags in."
license = "MIT"
repository = "https://github.com/trilogy-data/pytrilogy"
keywords = ["trilogy", "arrow", "datasource", "etl"]
categories = ["database", "command-line-interface"]
readme = "README.md"

[dependencies]
arrow = { version = "60", features = ["ipc", "csv", "json", "ffi"] }
parquet = { version = "60", features = ["arrow"] }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# Opt-in resident mode (`--vgi`). vgi is Query Farm Source-Available licensed,
# not OSI open source, which is why it is never a default feature.
vgi = { version = "0.47", default-features = false, optional = true }
vgi-rpc = { version = "0.32", optional = true }
shlex = { version = "1.3", optional = true }

[features]
vgi = ["dep:vgi", "dep:vgi-rpc", "dep:shlex"]

[dev-dependencies]
tempfile = "3.0"
